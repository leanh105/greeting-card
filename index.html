<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Khu Vườn Kỷ Niệm - Thiệp Chúc Mừng</title>

  <!-- Tối ưu Open Graph khi gửi link qua Zalo & Messenger -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="💌 Bạn nhận được một Khu Vườn Kỷ Niệm đặc biệt!" />
  <meta property="og:description" content="Chạm để mở phong bì và khám phá những đóa hoa lưu giữ kỷ niệm của chúng mình..." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1200&q=80" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Google Fonts hỗ trợ đầy đủ Tiếng Việt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            handwriting: ['"Dancing Script"', 'cursive'],
            sans: ['"Quicksand"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 1. Khóa cuộn trang & tối ưu khung nhìn Zalo/Messenger WebView (Android & iOS) */
    :root {
      --safe-top: env(safe-area-inset-top, 16px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      background: radial-gradient(circle at 50% 35%, #2e1527 0%, #160a16 65%, #0c050d 100%);
      color: #fff;
    }

    /* 2. Hiệu ứng Phong Bì 3D ở Bước 1 & Bước 2 */
    .envelope-wrapper {
      perspective: 1000px;
      will-change: transform, opacity;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
    }
    .envelope-flap {
      transform-origin: top center;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }
    .envelope-open .envelope-flap {
      transform: rotateX(180deg);
    }
    .envelope-open .envelope-letter {
      transform: translateY(-48px) scale(1.03);
    }
    .envelope-letter {
      transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s;
      will-change: transform;
    }

    /* 3. Hiệu ứng Nhịp thở (Pulsing) & Hào quang (Glow) tối ưu GPU 60FPS */
    @keyframes flowerBreath {
      0%, 100% { transform: scale3d(1, 1, 1); }
      50% { transform: scale3d(1.06, 1.06, 1); }
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.25; transform: scale3d(0.92, 0.92, 1); }
      50% { opacity: 0.85; transform: scale3d(1.18, 1.18, 1); }
    }
    @keyframes swayBouquet {
      0%, 100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.2deg); }
    }

    .bouquet-sway {
      transform-origin: bottom center;
      animation: swayBouquet 5.5s ease-in-out infinite;
      will-change: transform;
    }
    .flower-node {
      cursor: pointer;
      transform-box: fill-box;
      transform-origin: center;
      animation: flowerBreath 3.2s ease-in-out infinite;
      will-change: transform;
    }
    .flower-node:nth-child(2n) { animation-delay: -1.1s; }
    .flower-node:nth-child(3n) { animation-delay: -2.3s; }

    /* Quầng sáng tách riêng, chỉ animate opacity & scale3d thay vì drop-shadow */
    .flower-glow {
      transform-box: fill-box;
      transform-origin: center;
      animation: glowPulse 2.4s ease-in-out infinite;
      will-change: transform, opacity;
      pointer-events: none;
    }
    /* Đánh dấu bông hoa đã được mở xem */
    .flower-visited .flower-glow {
      opacity: 0.18 !important;
      animation: none !important;
    }

    /* 4. Con trỏ chữ Typing */
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor::after {
      content: '|';
      margin-left: 2px;
      color: #f9a8d4;
      animation: blinkCursor 0.8s infinite;
    }

    /* 5. Chuyển cảnh Lightbox mượt bằng GPU */
    .lightbox-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      will-change: opacity;
    }
    .lightbox-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-card {
      transform: scale3d(0.88, 0.88, 1) translateY(16px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
    }
    .lightbox-backdrop.active .lightbox-card {
      transform: scale3d(1, 1, 1) translateY(0);
    }
  </style>
</head>
<body class="font-sans relative flex flex-col justify-between items-center">

  <!-- CANVAS HIỆU ỨNG NỀN: Đốm sáng (Fireflies) & Cánh hoa rơi -->
  <canvas id="ambientCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- NÚT ĐIỀU KHIỂN ÂM THANH & TIẾN ĐỘ KHÁM PHÁ (Góc trên an toàn cho WebView) -->
  <header id="topBar" class="fixed top-0 left-0 right-0 z-30 flex justify-between items-center px-4 opacity-0 pointer-events-none transition-opacity duration-700"
          style="padding-top: max(var(--safe-top), 12px);">
    <div class="bg-white/10 backdrop-blur-md border border-pink-300/20 rounded-full px-3.5 py-1.5 text-xs font-medium text-pink-100 shadow-sm flex items-center gap-1.5">
      <span>🌸 Đã mở:</span>
      <span id="progressCounter" class="font-bold text-pink-300">0/5</span>
    </div>

    <button id="musicToggleBtn" aria-label="Bật/Tắt nhạc"
            class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-pink-300/20 flex items-center justify-center text-pink-200 active:scale-90 transition-transform shadow-sm">
      <svg id="iconMusicOn" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3" />
      </svg>
      <svg id="iconMusicOff" class="w-5 h-5 hidden text-pink-300/50" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
      </svg>
    </button>
  </header>

  <!-- =========================================================================
       BƯỚC 1 & 2: MỞ ĐẦU (LANDING) & KÍCH HOẠT (ACTIVATION)
       ========================================================================= -->
  <section id="landingView" class="relative z-20 flex flex-col items-center justify-center w-full h-full px-6 text-center">
    <div id="envelopeBox" class="envelope-wrapper w-full max-w-xs cursor-pointer" onclick="activateExperience()">
      <!-- Phong bì minh họa SVG & Thiệp bên trong -->
      <div class="relative w-72 h-48 mx-auto mb-8">
        <!-- Thân sau phong bì -->
        <div class="absolute inset-0 bg-rose-900/90 rounded-2xl shadow-2xl border border-pink-300/20"></div>

        <!-- Lá thư nhô lên khi mở -->
        <div class="envelope-letter absolute inset-x-4 top-3 bottom-3 bg-gradient-to-b from-pink-50 to-rose-100 rounded-xl shadow-md p-4 flex flex-col items-center justify-center text-rose-900">
          <span class="text-xs uppercase tracking-widest text-rose-400 font-semibold mb-1">Thiệp Kỷ Niệm</span>
          <h1 id="envTitle" class="font-handwriting text-2xl font-bold text-rose-700 leading-tight">Gửi người thương của anh</h1>
          <div class="mt-2 text-rose-400 text-lg">❦</div>
        </div>

        <!-- Mặt trước phong bì -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 288 192">
          <path d="M0,0 L144,110 L288,0 L288,180 Q288,192 276,192 L12,192 Q0,192 0,180 Z" fill="#9f1239" opacity="0.92"/>
          <path d="M0,192 L144,96 L288,192 Z" fill="#881337"/>
        </svg>

        <!-- Nắp phong bì (Lật khi chạm) -->
        <svg class="envelope-flap absolute top-0 left-0 w-full h-28 pointer-events-none z-10" viewBox="0 0 288 112">
          <path d="M0,0 L288,0 L144,108 Z" fill="#be123c" stroke="#fda4af" stroke-width="0.6"/>
        </svg>

        <!-- Con dấu sáp trái tim ở giữa -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-20 w-12 h-12 rounded-full bg-gradient-to-br from-amber-300 via-rose-500 to-rose-700 p-0.5 shadow-lg flex items-center justify-center animate-pulse">
          <div class="w-full h-full rounded-full bg-rose-700 flex items-center justify-center text-amber-200 text-xl">
            ♥
          </div>
        </div>
      </div>

      <!-- Lời đề từ nhẹ nhàng -->
      <p id="envSubtitle" class="text-pink-100/90 text-sm sm:text-base leading-relaxed mb-6 px-2">
        Một khu vườn nhỏ lưu giữ những khoảnh khắc của chúng mình...
      </p>

      <!-- Nút chạm mở phong bì & kích hoạt nhạc -->
      <button type="button"
              class="inline-flex items-center gap-2 px-7 py-3 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-white font-semibold text-sm shadow-lg shadow-rose-500/30 active:scale-95 transition-transform">
        <span id="envBtnText">Chạm để mở thiệp</span>
        <span>✨</span>
      </button>
    </div>
  </section>

  <!-- =========================================================================
       BƯỚC 3: KHÔNG GIAN CHÍNH (MAIN VIEW - THÔNG ĐIỆP & BÓ HOA TƯƠNG TÁC)
       ========================================================================= -->
  <main id="mainView" class="fixed inset-0 z-10 flex flex-col justify-between items-center px-4 opacity-0 pointer-events-none transition-opacity duration-1000"
        style="padding-top: calc(max(var(--safe-top), 16px) + 42px); padding-bottom: max(var(--safe-bottom), 14px);">

    <!-- Khu vực Thông điệp Tiếng Việt (Cố định min-height để chống nhảy khung hình khi chữ chạy) -->
    <div class="w-full max-w-md text-center bg-white/5 backdrop-blur-sm border border-pink-200/15 rounded-2xl p-4 shadow-inner">
      <h2 id="mainGreetingTitle" class="font-handwriting text-3xl sm:text-4xl text-pink-300 mb-1.5 drop-shadow">
        Chúc Mừng Ngày Đặc Biệt!
      </h2>
      <div class="min-h-[4.5rem] sm:min-h-[4rem] flex items-center justify-center">
        <p id="typingText" class="text-xs sm:text-sm text-pink-50/95 leading-relaxed typing-cursor"></p>
      </div>
    </div>

    <!-- Khu vực Trung tâm: Bó Hoa SVG Động với Vùng Chạm Chuẩn Di Động (>= 48x48px) -->
    <div class="relative flex-1 w-full max-w-sm flex items-center justify-center my-1 overflow-visible">
      <svg id="bouquetSvg" class="w-full h-full max-h-[52dvh] overflow-visible bouquet-sway" viewBox="0 0 360 420" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Quầng sáng radial gradient siêu nhẹ cho GPU -->
          <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fbcfe8" stop-opacity="0.95" />
            <stop offset="55%" stop-color="#f472b6" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
            <stop offset="55%" stop-color="#facc15" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#facc15" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="wrapPaper" x1="180" y1="210" x2="180" y2="395" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#fce7f3" />
            <stop offset="100%" stop-color="#f9a8d4" />
          </linearGradient>
        </defs>

        <!-- Tán lá và cành cây nền -->
        <g stroke="#15803d" stroke-width="3.5" stroke-linecap="round">
          <path d="M180 310 Q130 220 95 155" />
          <path d="M180 310 Q155 200 135 110" />
          <path d="M180 310 L180 95" />
          <path d="M180 310 Q205 200 225 110" />
          <path d="M180 310 Q230 220 265 155" />
        </g>
        <!-- Lá trang trí -->
        <g fill="#22c55e" opacity="0.85">
          <path d="M115 210 Q80 195 90 175 Q115 180 115 210 Z" />
          <path d="M245 210 Q280 195 270 175 Q245 180 245 210 Z" />
          <path d="M150 185 Q125 160 140 140 Q160 155 150 185 Z" />
          <path d="M210 185 Q235 160 220 140 Q200 155 210 185 Z" />
        </g>

        <!-- Giấy gói hoa & Nơ lụa -->
        <path d="M100 235 L260 235 L215 385 Q180 398 145 385 Z" fill="url(#wrapPaper)" opacity="0.92" />
        <path d="M85 220 L180 265 L275 220 L235 340 L125 340 Z" fill="#fbcfe8" opacity="0.75" />
        <!-- Nơ ruy băng -->
        <path d="M148 332 C120 315 120 355 152 342 Z" fill="#e11d48" />
        <path d="M212 332 C240 315 240 355 208 342 Z" fill="#e11d48" />
        <circle cx="180" cy="337" r="9" fill="#be123c" />
        <path d="M175 344 L162 388 M185 344 L198 388" stroke="#e11d48" stroke-width="5" stroke-linecap="round" />

        <!-- ===============================================================
             5 BÔNG HOA TƯƠNG TÁC (Mỗi bông có vùng chạm trong suốt r=38 ~ 76px)
             =============================================================== -->

        <!-- BÔNG 1: Hoa Hồng Đỏ (Trung tâm trên) -->
        <g class="flower-node" data-index="0" onclick="openMemory(0)">
          <circle class="flower-glow" cx="180" cy="95" r="46" fill="url(#softGlow)" />
          <circle cx="180" cy="95" r="38" fill="transparent" /> <!-- Hitbox mở rộng cho ngón tay -->
          <g transform="translate(180, 95)">
            <circle cx="0" cy="-16" r="16" fill="#f43f5e" />
            <circle cx="15" cy="-5" r="16" fill="#e11d48" />
            <circle cx="10" cy="13" r="16" fill="#f43f5e" />
            <circle cx="-10" cy="13" r="16" fill="#e11d48" />
            <circle cx="-15" cy="-5" r="16" fill="#fb7185" />
            <circle cx="0" cy="0" r="12" fill="#be123c" />
            <path d="M-5 -2 Q0 -8 6 -1 Q2 6 -4 3 Z" fill="#fda4af" />
          </g>
        </g>

        <!-- BÔNG 2: Hoa Tulip Hồng (Trái trên) -->
        <g class="flower-node" data-index="1" onclick="openMemory(1)">
          <circle class="flower-glow" cx="115" cy="128" r="44" fill="url(#softGlow)" />
          <circle cx="115" cy="128" r="38" fill="transparent" />
          <g transform="translate(115, 128)">
            <ellipse cx="-10" cy="0" rx="12" ry="20" transform="rotate(-18 -10 0)" fill="#f472b6" />
            <ellipse cx="10" cy="0" rx="12" ry="20" transform="rotate(18 10 0)" fill="#ec4899" />
            <ellipse cx="0" cy="-3" rx="13" ry="22" fill="#f9a8d4" />
            <circle cx="0" cy="-6" r="5" fill="#fef08a" />
          </g>
        </g>

        <!-- BÔNG 3: Hoa Hướng Dương (Phải trên) -->
        <g class="flower-node" data-index="2" onclick="openMemory(2)">
          <circle class="flower-glow" cx="245" cy="128" r="44" fill="url(#goldGlow)" />
          <circle cx="245" cy="128" r="38" fill="transparent" />
          <g transform="translate(245, 128)">
            <g fill="#facc15">
              <ellipse cx="0" cy="-20" rx="7" ry="12" />
              <ellipse cx="0" cy="20" rx="7" ry="12" />
              <ellipse cx="-20" cy="0" rx="12" ry="7" />
              <ellipse cx="20" cy="0" rx="12" ry="7" />
              <ellipse cx="-14" cy="-14" rx="10" ry="7" transform="rotate(45 -14 -14)" />
              <ellipse cx="14" cy="-14" rx="10" ry="7" transform="rotate(-45 14 -14)" />
              <ellipse cx="-14" cy="14" rx="10" ry="7" transform="rotate(-45 -14 14)" />
              <ellipse cx="14" cy="14" rx="10" ry="7" transform="rotate(45 14 14)" />
            </g>
            <circle cx="0" cy="0" r="13" fill="#78350f" />
            <circle cx="-4" cy="-3" r="2" fill="#fde047" />
          </g>
        </g>

        <!-- BÔNG 4: Hoa Cẩm Tú Cầu Xanh Hồng (Trái dưới) -->
        <g class="flower-node" data-index="3" onclick="openMemory(3)">
          <circle class="flower-glow" cx="100" cy="195" r="44" fill="url(#softGlow)" />
          <circle cx="100" cy="195" r="38" fill="transparent" />
          <g transform="translate(100, 195)">
            <circle cx="-10" cy="-8" r="13" fill="#93c5fd" />
            <circle cx="10" cy="-8" r="13" fill="#c4b5fd" />
            <circle cx="-10" cy="10" r="13" fill="#a5b4fc" />
            <circle cx="10" cy="10" r="13" fill="#f9a8d4" />
            <circle cx="0" cy="0" r="11" fill="#e0e7ff" />
            <circle cx="0" cy="0" r="4" fill="#fb7185" />
          </g>
        </g>

        <!-- BÔNG 5: Hoa Lưu Ly Tím (Phải dưới) -->
        <g class="flower-node" data-index="4" onclick="openMemory(4)">
          <circle class="flower-glow" cx="260" cy="195" r="44" fill="url(#softGlow)" />
          <circle cx="260" cy="195" r="38" fill="transparent" />
          <g transform="translate(260, 195)">
            <circle cx="0" cy="-15" r="13" fill="#c084fc" />
            <circle cx="14" cy="-4" r="13" fill="#a855f7" />
            <circle cx="9" cy="12" r="13" fill="#d8b4fe" />
            <circle cx="-9" cy="12" r="13" fill="#a855f7" />
            <circle cx="-14" cy="-4" r="13" fill="#c084fc" />
            <circle cx="0" cy="0" r="7" fill="#fef08a" />
          </g>
        </g>
      </svg>
    </div>

    <!-- Dòng nhắc tương tác dưới chân màn hình -->
    <div class="w-full text-center pb-1">
      <p id="mainHintText" class="inline-block px-4 py-1.5 rounded-full bg-pink-500/15 border border-pink-300/20 text-xs text-pink-200 animate-pulse">
        ✨ Chạm vào từng bông hoa đang tỏa sáng để xem kỷ niệm
      </p>
    </div>
  </main>

  <!-- =========================================================================
       BƯỚC 4: KHÁM PHÁ (LIGHTBOX MODAL HIỂN THỊ ẢNH KỶ NIỆM & GHI CHÚ)
       ========================================================================= -->
  <div id="lightboxModal" class="lightbox-backdrop fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4"
       onclick="closeMemory(event)">
    <div class="lightbox-card relative w-full max-w-sm bg-gradient-to-b from-rose-950 to-slate-950 border border-pink-300/30 rounded-3xl overflow-hidden shadow-2xl"
         onclick="event.stopPropagation()">

      <!-- Nút đóng góc phải trên (Chuẩn 44x44px dễ bấm) -->
      <button type="button" onclick="closeMemory()" aria-label="Đóng khung ảnh"
              class="absolute top-3 right-3 z-20 w-10 h-10 rounded-full bg-black/50 backdrop-blur-md border border-white/20 flex items-center justify-center text-white active:scale-90 transition-transform">
        ✕
      </button>

      <!-- Khung ảnh kỷ niệm (Đã được tải trước ở Bước 1) -->
      <div class="relative w-full aspect-[4/3] bg-rose-950/50 overflow-hidden">
        <img id="modalImage" src="" alt="Ảnh kỷ niệm"
             class="w-full h-full object-cover transition-transform duration-500" />
        <div class="absolute inset-x-0 bottom-0 h-20 bg-gradient-to-t from-rose-950 to-transparent"></div>
        <span id="modalFlowerBadge" class="absolute bottom-3 left-4 px-3 py-0.5 rounded-full bg-pink-500/80 backdrop-blur-sm text-[11px] font-semibold text-white">
          Hoa Hồng Đỏ
        </span>
        <span id="modalDate" class="absolute bottom-3 right-4 text-xs text-pink-200/90 font-medium">
          14/02/2024
        </span>
      </div>

      <!-- Nội dung lời nhắn kỷ niệm -->
      <div class="p-5 text-center">
        <h3 id="modalTitle" class="font-handwriting text-2xl sm:text-3xl text-pink-300 mb-2">
          Ngày Đầu Tiên Gặp Gỡ
        </h3>
        <p id="modalNote" class="text-sm text-pink-100/90 leading-relaxed mb-5">
          Khoảnh khắc ánh mắt ta chạm nhau...
        </p>

        <!-- Điều hướng xem hoa tiếp theo hoặc đóng -->
        <div class="flex items-center justify-center gap-3">
          <button type="button" onclick="navigateMemory(-1)"
                  class="px-4 py-2 rounded-full bg-white/10 text-xs font-medium text-pink-200 active:scale-95 transition-transform">
            ← Hoa trước
          </button>
          <button type="button" onclick="closeMemory()"
                  class="px-6 py-2 rounded-full bg-gradient-to-r from-pink-500 to-rose-500 text-xs font-semibold text-white shadow-md shadow-rose-500/30 active:scale-95 transition-transform">
            Ngắm tiếp bó hoa
          </button>
          <button type="button" onclick="navigateMemory(1)"
                  class="px-4 py-2 rounded-full bg-white/10 text-xs font-medium text-pink-200 active:scale-95 transition-transform">
            Hoa sau →
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Trình phát nhạc nền ẩn -->
  <audio id="bgMusic" loop preload="auto"></audio>

  <!-- =========================================================================
       JAVASCRIPT THUẦN: QUẢN LÝ DỮ LIỆU, PRELOAD, ÂM THANH & CANVAS 60FPS
       ========================================================================= -->
  <script>
    // 1. Dữ liệu mặc định (Fallback nếu mở trực tiếp file://, sẽ được ghi đè bởi data.json khi chạy trên Vercel/Netlify)
    let appData = {
      meta: {
        envelopeTitle: "Gửi người thương của anh",
        envelopeSubtitle: "Một khu vườn nhỏ lưu giữ những khoảnh khắc của chúng mình...",
        buttonText: "Chạm để mở thiệp",
        musicUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3"
      },
      mainView: {
        greetingTitle: "Chúc Mừng Ngày Đặc Biệt!",
        typingMessage: "Cảm ơn em đã luôn là ánh nắng ấm áp trong cuộc đời anh. Mỗi bông hoa trong bó hoa này đều cất giữ một kỷ niệm đẹp của hai đứa mình. Em hãy chạm nhẹ vào từng bông hoa để mở ra nhé!",
        hintText: "✨ Chạm vào từng bông hoa đang tỏa sáng để xem kỷ niệm"
      },
      memories: [
        {
          id: 1,
          flowerName: "Hoa Hồng Đỏ",
          title: "Ngày Đầu Tiên Gặp Gỡ",
          date: "14/02/2024",
          image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=800&q=80",
          note: "Khoảnh khắc ánh mắt ta chạm nhau ở quán cà phê nhỏ, anh biết mình đã tìm thấy mảnh ghép còn thiếu."
        },
        {
          id: 2,
          flowerName: "Hoa Tulip Hồng",
          title: "Chuyến Đi Xa Đầu Tiên",
          date: "30/04/2024",
          image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=800&q=80",
          note: "Cùng nhau đón bình minh trên đỉnh đồi lộng gió, nắm tay nhau đi qua những con dốc dài."
        },
        {
          id: 3,
          flowerName: "Hoa Hướng Dương",
          title: "Nụ Cười Rạng Rỡ Nhất",
          date: "20/10/2024",
          image: "https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=80",
          note: "Em luôn tỏa sáng và mang lại năng lượng tích cực giống như đóa hướng dương hướng về mặt trời."
        },
        {
          id: 4,
          flowerName: "Hoa Cẩm Tú Cầu",
          title: "Cơn Mưa Chiều Bất Chợt",
          date: "15/12/2024",
          image: "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?auto=format&fit=crop&w=800&q=80",
          note: "Hai đứa đứng trú mưa dưới hiên nhà, cùng nghe chung một bản nhạc qua chiếc tai nghe nhỏ."
        },
        {
          id: 5,
          flowerName: "Hoa Lưu Ly Tím",
          title: "Lời Hứa Cho Tương Lai",
          date: "Hôm nay & Mãi mãi",
          image: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80",
          note: "Chúc người thương luôn bình yên, rạng rỡ. Chúng mình hãy cùng nhau viết tiếp thật nhiều mùa hoa nữa nhé!"
        }
      ]
    };

    const visitedFlowers = new Set();
    let currentMemoryIndex = 0;
    let isActivated = false;
    let isMusicPlaying = false;
    let isCanvasPaused = false;

    const bgMusic = document.getElementById('bgMusic');
    const musicToggleBtn = document.getElementById('musicToggleBtn');
    const iconMusicOn = document.getElementById('iconMusicOn');
    const iconMusicOff = document.getElementById('iconMusicOff');

    // 2. Tải dữ liệu từ file data.json & Preload toàn bộ ảnh kỷ niệm ngay ở Bước 1
    async function initDataAndPreload() {
      try {
        const res = await fetch('./data.json');
        if (res.ok) {
          appData = await res.json();
        }
      } catch (e) {
        // Sử dụng dữ liệu fallback nếu mở file trực tiếp không qua HTTP server
      }

      // Cập nhật nội dung giao diện từ dữ liệu
      document.getElementById('envTitle').textContent = appData.meta.envelopeTitle;
      document.getElementById('envSubtitle').textContent = appData.meta.envelopeSubtitle;
      document.getElementById('envBtnText').textContent = appData.meta.buttonText;
      document.getElementById('mainGreetingTitle').textContent = appData.mainView.greetingTitle;
      document.getElementById('mainHintText').textContent = appData.mainView.hintText;
      document.getElementById('progressCounter').textContent = `0/${appData.memories.length}`;
      bgMusic.src = appData.meta.musicUrl;

      // Tải trước (Preload) ảnh vào bộ nhớ đệm trong lúc người nhận đang ngắm phong bì
      appData.memories.forEach(item => {
        const img = new Image();
        img.src = item.image;
      });
    }

    // 3. Bước 2: Kích hoạt mở phong bì, phát nhạc & chuyển sang Không gian chính
    function activateExperience() {
      if (isActivated) return;
      isActivated = true;

      const envelopeBox = document.getElementById('envelopeBox');
      const landingView = document.getElementById('landingView');
      const mainView = document.getElementById('mainView');
      const topBar = document.getElementById('topBar');

      // Mở nắp phong bì
      envelopeBox.classList.add('envelope-open');

      // Khởi chạy nhạc nền hợp lệ theo chính sách Autoplay của iOS/Android
      bgMusic.volume = 0.65;
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        updateMusicIcon();
      }).catch(() => {
        isMusicPlaying = false;
        updateMusicIcon();
      });

      // Chuyển cảnh mượt sang Không gian chính sau khi phong bì mở
      setTimeout(() => {
        envelopeBox.style.opacity = '0';
        envelopeBox.style.transform = 'scale(1.08)';
      }, 650);

      setTimeout(() => {
        landingView.style.display = 'none';
        mainView.classList.remove('opacity-0', 'pointer-events-none');
        topBar.classList.remove('opacity-0', 'pointer-events-none');
        startTypingEffect(appData.mainView.typingMessage);
      }, 1250);
    }

    // 4. Hiệu ứng chữ viết tay / Typing Tiếng Việt mượt mà
    function startTypingEffect(text) {
      const target = document.getElementById('typingText');
      target.textContent = '';
      let index = 0;

      function typeNextChar() {
        if (index < text.length) {
          target.textContent += text.charAt(index);
          index++;
          setTimeout(typeNextChar, 34);
        } else {
          target.classList.remove('typing-cursor');
        }
      }
      typeNextChar();
    }

    // 5. Bước 4: Mở Lightbox xem ảnh kỷ niệm & Tạm dừng Canvas để dồn 100% GPU cho Modal
    function openMemory(index) {
      const memory = appData.memories[index];
      if (!memory) return;

      currentMemoryIndex = index;
      isCanvasPaused = true; // Tạm dừng vẽ hạt nền để tránh tuột FPS khi bung popup

      document.getElementById('modalImage').src = memory.image;
      document.getElementById('modalFlowerBadge').textContent = memory.flowerName;
      document.getElementById('modalDate').textContent = memory.date;
      document.getElementById('modalTitle').textContent = memory.title;
      document.getElementById('modalNote').textContent = memory.note;

      const modal = document.getElementById('lightboxModal');
      modal.classList.add('active');

      // Đánh dấu bông hoa đã mở
      visitedFlowers.add(index);
      const flowerNode = document.querySelector(`.flower-node[data-index="${index}"]`);
      if (flowerNode) flowerNode.classList.add('flower-visited');
      document.getElementById('progressCounter').textContent = `${visitedFlowers.size}/${appData.memories.length}`;
    }

    function navigateMemory(direction) {
      const total = appData.memories.length;
      const nextIndex = (currentMemoryIndex + direction + total) % total;
      openMemory(nextIndex);
    }

    function closeMemory(event) {
      if (event && event.target !== event.currentTarget) return;
      const modal = document.getElementById('lightboxModal');
      modal.classList.remove('active');
      isCanvasPaused = false; // Khôi phục hiệu ứng nền Canvas
    }

    // 6. Quản lý Âm thanh thông minh (Tự động tắt khi ẩn ứng dụng Zalo/Messenger)
    function updateMusicIcon() {
      if (isMusicPlaying) {
        iconMusicOn.classList.remove('hidden');
        iconMusicOff.classList.add('hidden');
      } else {
        iconMusicOn.classList.add('hidden');
        iconMusicOff.classList.remove('hidden');
      }
    }

    musicToggleBtn.addEventListener('click', () => {
      if (bgMusic.paused) {
        bgMusic.play();
        isMusicPlaying = true;
      } else {
        bgMusic.pause();
        isMusicPlaying = false;
      }
      updateMusicIcon();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (isMusicPlaying) bgMusic.pause();
        isCanvasPaused = true;
      } else {
        if (isMusicPlaying && isActivated) bgMusic.play().catch(() => {});
        if (!document.getElementById('lightboxModal').classList.contains('active')) {
          isCanvasPaused = false;
        }
      }
    });

    // 7. Hệ thống Hạt (Canvas): Đốm sáng (Fireflies) & Cánh hoa rơi tối ưu cho Retina & Android
    function initAmbientCanvas() {
      const canvas = document.getElementById('ambientCanvas');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0;

      function resizeCanvas() {
        // Khóa tỷ lệ điểm ảnh tối đa ở mức 2 để tránh quá tải GPU trên iPhone 3x
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.scale(dpr, dpr);
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Giới hạn 22 hạt trên màn hình di động để giữ vững 60FPS
      const PARTICLE_COUNT = 22;
      const particles = Array.from({ length: PARTICLE_COUNT }, (_, i) => ({
        isPetal: i < 10, // 10 cánh hoa rơi + 12 đốm sáng đom đóm
        x: Math.random() * width,
        y: Math.random() * height,
        size: i < 10 ? 4 + Math.random() * 4 : 1.5 + Math.random() * 2.2,
        speedY: i < 10 ? 0.35 + Math.random() * 0.55 : -0.15 - Math.random() * 0.3,
        speedX: (Math.random() - 0.5) * 0.4,
        angle: Math.random() * Math.PI * 2,
        spin: (Math.random() - 0.5) * 0.02,
        alpha: 0.3 + Math.random() * 0.6,
        alphaSpeed: 0.008 + Math.random() * 0.012
      }));

      function renderLoop() {
        if (!isCanvasPaused) {
          ctx.clearRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.speedX + Math.sin(p.angle) * 0.25;
            p.y += p.speedY;
            p.angle += p.spin;
            p.alpha += p.alphaSpeed;

            if (p.alpha > 0.9 || p.alpha < 0.2) p.alphaSpeed *= -1;

            // Tuần hoàn vị trí hạt khi đi ra khỏi màn hình
            if (p.y > height + 15) p.y = -15;
            if (p.y < -15) p.y = height + 15;
            if (p.x > width + 15) p.x = -15;
            if (p.x < -15) p.x = width + 15;

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.globalAlpha = Math.max(0.15, Math.min(0.9, p.alpha));

            if (p.isPetal) {
              // Vẽ cánh hoa đào/hoa hồng rơi nhẹ
              ctx.rotate(p.angle);
              ctx.fillStyle = '#fda4af';
              ctx.beginPath();
              ctx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
              ctx.fill();
            } else {
              // Vẽ đốm sáng (Firefly)
              ctx.fillStyle = '#fef08a';
              ctx.beginPath();
              ctx.arc(0, 0, p.size, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }
        }
        requestAnimationFrame(renderLoop);
      }
      requestAnimationFrame(renderLoop);
    }

    // Khởi tạo ứng dụng
    window.addEventListener('DOMContentLoaded', () => {
      initDataAndPreload();
      initAmbientCanvas();
    });
  </script>
